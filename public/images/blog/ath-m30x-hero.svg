<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="A flat studio monitoring response curve beside a bass-boosted consumer curve, showing how a flat pair reveals problems a consumer pair hides" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/><stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.15"/><stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/><rect width="1600" height="840" fill="url(#glow)"/>
  <text x="150" y="120" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">FLAT TELLS YOU THE TRUTH</text>

  <g transform="translate(150 190)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#e57329">STUDIO MONITORING — FLAT</text>
    <rect x="0" y="24" width="1300" height="180" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M20 134 L 1280 134" stroke="#e57329" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="20" y="182" font-size="17" fill="#ffffff" fill-opacity="0.55">Plosives, sibilance, rumble and room tone all arrive at their real size</text>
  </g>

  <g transform="translate(150 460)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#ffffff" fill-opacity="0.85">CONSUMER TUNING — FLATTERING</text>
    <rect x="0" y="24" width="1300" height="180" rx="10" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M20 70 C 220 70, 300 150, 560 150 S 1040 150, 1280 108" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="20" y="182" font-size="17" fill="#ffffff" fill-opacity="0.55">A lifted low end hides the exact faults you need to catch</text>
  </g>

  <text x="150" y="790" font-size="20" fill="#ffffff" fill-opacity="0.55">A monitoring headphone's job is to make bad audio sound bad.</text>
</svg>
