<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="Four faults a flat broadcast headphone reveals — sibilance, plosives, room tone and handling noise — listed against a flat response line" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/><stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.15"/><stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/><rect width="1600" height="840" fill="url(#glow)"/>
  <text x="150" y="120" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">WHAT A FLAT PAIR REVEALS</text>
  <path d="M150 190 L 1450 190" stroke="#e57329" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(150 250)">
    <g><rect width="300" height="150" rx="12" fill="#ffffff" fill-opacity="0.1"/>
      <text x="24" y="52" font-size="21" font-weight="700" fill="#ffffff">SIBILANCE</text>
      <text x="24" y="88" font-size="16" fill="#ffffff" fill-opacity="0.55">the harsh edge on</text>
      <text x="24" y="112" font-size="16" fill="#ffffff" fill-opacity="0.55">s and t sounds</text></g>
    <g transform="translate(330 0)"><rect width="300" height="150" rx="12" fill="#ffffff" fill-opacity="0.1"/>
      <text x="24" y="52" font-size="21" font-weight="700" fill="#ffffff">PLOSIVES</text>
      <text x="24" y="88" font-size="16" fill="#ffffff" fill-opacity="0.55">the thump of a hard</text>
      <text x="24" y="112" font-size="16" fill="#ffffff" fill-opacity="0.55">p on the capsule</text></g>
    <g transform="translate(660 0)"><rect width="300" height="150" rx="12" fill="#ffffff" fill-opacity="0.1"/>
      <text x="24" y="52" font-size="21" font-weight="700" fill="#ffffff">ROOM TONE</text>
      <text x="24" y="88" font-size="16" fill="#ffffff" fill-opacity="0.55">reflections off a desk</text>
      <text x="24" y="112" font-size="16" fill="#ffffff" fill-opacity="0.55">or a bare wall</text></g>
    <g transform="translate(990 0)"><rect width="300" height="150" rx="12" fill="#ffffff" fill-opacity="0.1"/>
      <text x="24" y="52" font-size="21" font-weight="700" fill="#ffffff">HANDLING</text>
      <text x="24" y="88" font-size="16" fill="#ffffff" fill-opacity="0.55">desk bumps, mic arm,</text>
      <text x="24" y="112" font-size="16" fill="#ffffff" fill-opacity="0.55">chair creak</text></g>
  </g>

  <text x="150" y="520" font-size="20" fill="#e57329">All four are cheap to fix while recording.</text>
  <text x="150" y="556" font-size="20" fill="#ffffff" fill-opacity="0.55">All four are expensive or impossible to fix afterwards.</text>
  <text x="150" y="790" font-size="20" fill="#ffffff" fill-opacity="0.55">The broadcast standard since 1991.</text>
</svg>
