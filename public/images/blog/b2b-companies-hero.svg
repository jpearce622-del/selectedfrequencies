<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="A shortlist of the best podcast production companies for B2B compared across specialism and engagement type" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/>
      <stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#glow)"/>
  <g transform="translate(150 130)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">FOUR CATEGORIES, NOT ONE LIST</text>
    <g transform="translate(0 70)">
      <rect width="802" height="74" rx="12" fill="#3d5470"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#ffffff">FULL-SERVICE AGENCY</text>
      <text x="826" y="40" font-size="19" fill="#ffffff" fill-opacity="0.6">strategy + production + promotion</text>
    </g>
    <g transform="translate(0 162)">
      <rect width="590" height="74" rx="12" fill="#3d5470"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#ffffff">RELATIONSHIP-LED</text>
      <text x="614" y="40" font-size="19" fill="#ffffff" fill-opacity="0.6">the show is the introduction</text>
    </g>
    <g transform="translate(0 254)">
      <rect width="519" height="74" rx="12" fill="#3d5470"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#ffffff">ABM / DEMAND GEN</text>
      <text x="543" y="40" font-size="19" fill="#ffffff" fill-opacity="0.6">production + attribution</text>
    </g>
    <g transform="translate(0 346)">
      <rect width="377" height="74" rx="12" fill="#e57329"/>
      <text x="24" y="40" font-size="20" font-weight="700" fill="#ffffff">PRODUCTION STUDIO</text>
      <text x="401" y="40" font-size="19" fill="#ffffff" fill-opacity="0.6">make the show you already have</text>
    </g>
  </g>
</svg>
