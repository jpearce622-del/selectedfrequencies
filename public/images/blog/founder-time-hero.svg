<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="A week of time blocks, most of them taken up by podcast production tasks, with only a small share left for the recording itself" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/>
      <stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#glow)"/>

  <!-- A single week, as stacked hour blocks. The one warm block is the
       recording; everything else is the work around it. -->
  <g transform="translate(150 150)">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">ONE WEEK, ONE EPISODE</text>

    <!-- Row 1: recording (the visible part) -->
    <g transform="translate(0 60)">
      <rect width="150" height="52" rx="10" fill="#e57329"/>
      <text x="18" y="33" font-size="17" font-weight="700" fill="#ffffff">RECORD</text>
      <text x="176" y="33" font-size="17" fill="#ffffff" fill-opacity="0.55">1.5 hrs — the part everyone counts</text>
    </g>

    <!-- Rows 2-6: everything else -->
    <g font-size="17" fill="#ffffff">
      <g transform="translate(0 132)">
        <rect width="250" height="52" rx="10" fill="#ffffff" fill-opacity="0.16"/>
        <text x="18" y="33" font-weight="600" fill-opacity="0.85">EDIT</text>
        <text x="276" y="33" fill-opacity="0.45">2.5 hrs</text>
      </g>
      <g transform="translate(0 204)">
        <rect width="160" height="52" rx="10" fill="#ffffff" fill-opacity="0.14"/>
        <text x="18" y="33" font-weight="600" fill-opacity="0.85">BOOK</text>
        <text x="186" y="33" fill-opacity="0.45">1.5 hrs</text>
      </g>
      <g transform="translate(0 276)">
        <rect width="110" height="52" rx="10" fill="#ffffff" fill-opacity="0.12"/>
        <text x="18" y="33" font-weight="600" fill-opacity="0.85">PREP</text>
        <text x="136" y="33" fill-opacity="0.45">1 hr</text>
      </g>
      <g transform="translate(0 348)">
        <rect width="110" height="52" rx="10" fill="#ffffff" fill-opacity="0.12"/>
        <text x="18" y="33" font-weight="600" fill-opacity="0.85">NOTES</text>
        <text x="136" y="33" fill-opacity="0.45">1 hr</text>
      </g>
      <g transform="translate(0 420)">
        <rect width="110" height="52" rx="10" fill="#ffffff" fill-opacity="0.1"/>
        <text x="18" y="33" font-weight="600" fill-opacity="0.85">PUBLISH</text>
        <text x="136" y="33" fill-opacity="0.45">1 hr</text>
      </g>
    </g>

    <!-- Total -->
    <line x1="0" y1="500" x2="620" y2="500" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <text x="0" y="540" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.55">Self-produced total</text>
    <text x="620" y="540" font-size="34" font-weight="700" fill="#f0904f" text-anchor="end">8.5 hrs</text>
  </g>

  <!-- Right-hand contrast: the produced version -->
  <g transform="translate(1000 210)">
    <rect width="420" height="300" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#e57329" stroke-opacity="0.35" stroke-width="2"/>
    <text x="34" y="58" font-size="15" font-weight="700" fill="#f0904f" letter-spacing="2">PRODUCED</text>
    <text x="34" y="130" font-size="64" font-weight="700" fill="#ffffff">4.5</text>
    <text x="150" y="130" font-size="22" fill="#ffffff" fill-opacity="0.6">hrs / week</text>
    <text x="34" y="186" font-size="17" fill="#ffffff" fill-opacity="0.7">You keep the conversation,</text>
    <text x="34" y="214" font-size="17" fill="#ffffff" fill-opacity="0.7">the guests, and the direction.</text>
    <text x="34" y="256" font-size="17" fill="#ffffff" fill-opacity="0.45">Everything downstream is handled.</text>
  </g>
</svg>
