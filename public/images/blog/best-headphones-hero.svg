<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="Four pairs of podcast headphones ranked by role — best budget, best all-round, best for field recording, and one popular pair that is not for podcasting" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/><stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.15"/><stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/><rect width="1600" height="840" fill="url(#glow)"/>
  <text x="150" y="120" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">FOUR PAIRS, FOUR DIFFERENT JOBS</text>

  <g transform="translate(150 190)">
    <g><rect width="1300" height="110" rx="12" fill="#ffffff" fill-opacity="0.12"/>
      <text x="30" y="46" font-size="15" font-weight="700" fill="#e57329" letter-spacing="1.5">BEST BUDGET</text>
      <text x="30" y="84" font-size="26" font-weight="700" fill="#ffffff">Audio-Technica ATH-M30x</text>
      <text x="1120" y="72" font-size="22" fill="#ffffff" fill-opacity="0.55">~£50–70</text></g>

    <g transform="translate(0 132)"><rect width="1300" height="110" rx="12" fill="#e57329"/>
      <text x="30" y="46" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1.5">BEST ALL-ROUND</text>
      <text x="30" y="84" font-size="26" font-weight="700" fill="#ffffff">Sony MDR-7506</text>
      <text x="1108" y="72" font-size="22" fill="#ffffff" fill-opacity="0.8">~£80–110</text></g>

    <g transform="translate(0 264)"><rect width="1300" height="110" rx="12" fill="#ffffff" fill-opacity="0.12"/>
      <text x="30" y="46" font-size="15" font-weight="700" fill="#e57329" letter-spacing="1.5">BEST FOR FIELD &amp; IN-PERSON</text>
      <text x="30" y="84" font-size="26" font-weight="700" fill="#ffffff">Sennheiser HD 25</text>
      <text x="1100" y="72" font-size="22" fill="#ffffff" fill-opacity="0.55">~£120–150</text></g>

    <g transform="translate(0 396)"><rect width="1300" height="110" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="7 7"/>
      <text x="30" y="46" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.5" letter-spacing="1.5">POPULAR — BUT NOT FOR PODCASTING</text>
      <text x="30" y="84" font-size="26" font-weight="700" fill="#ffffff" fill-opacity="0.55">Monoprice 110010</text>
      <text x="1136" y="72" font-size="22" fill="#ffffff" fill-opacity="0.4">~£80</text></g>
  </g>

  <text x="150" y="790" font-size="20" fill="#ffffff" fill-opacity="0.55">Closed-back, no noise cancelling, flat rather than flattering.</text>
</svg>
