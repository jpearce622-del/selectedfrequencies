    <text x="188" y="266" font-size="24" font-weight="700" fill="#ffffff" fill-opacity="0.8">$15–$25</text>

    <text x="796" y="205" font-size="26" font-weight="700" fill="#f0904f" letter-spacing="2">MID-ROLL</text>
    <text x="796" y="245" font-size="44" font-weight="800" fill="#ffffff">$25–$50</text>
    <text x="796" y="277" font-size="19" font-weight="600" fill="#f0904f" fill-opacity="0.9">the premium slot</text>

    <text x="1402" y="235" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.55" letter-spacing="2">POST-ROLL</text>
    <text x="1402" y="266" font-size="24" font-weight="700" fill="#ffffff" fill-opacity="0.8">$10–$20</text>
