<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="Single-ear monitoring illustrated: one ear on the recording and one ear on the room, made possible by a rotating headphone capsule" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/><stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.15"/><stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/><rect width="1600" height="840" fill="url(#glow)"/>
  <text x="150" y="120" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">ONE EAR ON THE MIX, ONE ON THE ROOM</text>

  <!-- Left: the recording -->
  <g transform="translate(150 210)">
    <rect width="580" height="330" rx="16" fill="#e57329"/>
    <text x="40" y="70" font-size="24" font-weight="700" fill="#ffffff">LEFT EAR</text>
    <text x="40" y="130" font-size="30" font-weight="700" fill="#ffffff">The recording</text>
    <text x="40" y="184" font-size="18" fill="#ffffff" fill-opacity="0.85">What the microphones are</text>
    <text x="40" y="212" font-size="18" fill="#ffffff" fill-opacity="0.85">actually capturing, isolated</text>
    <text x="40" y="240" font-size="18" fill="#ffffff" fill-opacity="0.85">from the room around you</text>
    <text x="40" y="292" font-size="17" fill="#ffffff" fill-opacity="0.7">Capsule closed</text>
  </g>

  <!-- Right: the room -->
  <g transform="translate(790 210)">
    <rect width="580" height="330" rx="16" fill="#ffffff" fill-opacity="0.12"/>
    <text x="40" y="70" font-size="24" font-weight="700" fill="#ffffff" fill-opacity="0.9">RIGHT EAR</text>
    <text x="40" y="130" font-size="30" font-weight="700" fill="#ffffff">The room</text>
    <text x="40" y="184" font-size="18" fill="#ffffff" fill-opacity="0.6">Your guest as a person, and</text>
    <text x="40" y="212" font-size="18" fill="#ffffff" fill-opacity="0.6">the aeroplane, the lorry, the</text>
    <text x="40" y="240" font-size="18" fill="#ffffff" fill-opacity="0.6">fridge that just kicked in</text>
    <text x="40" y="292" font-size="17" fill="#e57329">Capsule rotated aside</text>
  </g>

  <text x="150" y="640" font-size="20" fill="#ffffff" fill-opacity="0.55">Almost no over-ear monitoring headphone can do this.</text>
  <text x="150" y="790" font-size="20" fill="#ffffff" fill-opacity="0.55">In DJ booths and broadcast trucks for over 30 years.</text>
</svg>
