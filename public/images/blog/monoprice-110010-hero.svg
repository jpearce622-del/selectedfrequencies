<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-label="Over-ear headphones beside two frequency response curves — a flat monitoring curve and a bass-boosted consumer curve" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3e57"/>
      <stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#e57329" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e57329" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#glow)"/>

  <!-- ===== Headphones ===== -->
  <g transform="translate(340 420)" stroke-linecap="round">
    <!-- headband -->
    <path d="M-186 24 C -186 -166, 186 -166, 186 24"
      fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="26"/>
    <path d="M-186 24 C -186 -166, 186 -166, 186 24"
      fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="10"/>
    <!-- ear cups -->
    <g>
      <rect x="-232" y="14" width="92" height="150" rx="42" fill="#0f1826" stroke="#ffffff" stroke-opacity="0.45" stroke-width="9"/>
      <rect x="-216" y="34" width="60" height="110" rx="30" fill="#ffffff" fill-opacity="0.10"/>
      <rect x="140" y="14" width="92" height="150" rx="42" fill="#0f1826" stroke="#ffffff" stroke-opacity="0.45" stroke-width="9"/>
      <rect x="156" y="34" width="60" height="110" rx="30" fill="#ffffff" fill-opacity="0.10"/>
    </g>
    <!-- ANC indicator -->
    <g transform="translate(186 89)">
      <circle r="19" fill="#e57329"/>
      <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">ANC</text>
    </g>
  </g>
  <text x="340" y="668" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff" fill-opacity="0.6" letter-spacing="2">MONOPRICE 110010</text>

  <!-- ===== Frequency response comparison ===== -->
  <g transform="translate(760 190)">
    <rect width="700" height="440" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
      <line x1="60" y1="110" x2="640" y2="110"/>
      <line x1="60" y1="200" x2="640" y2="200"/>
      <line x1="60" y1="290" x2="640" y2="290"/>
      <line x1="60" y1="380" x2="640" y2="380"/>
    </g>

    <!-- flat monitoring curve -->
    <path d="M60 220 L 180 218 L 320 222 L 460 220 L 640 226"
      fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
    <!-- bass-boosted consumer curve -->
    <path d="M60 128 C 150 132, 210 205, 300 224 C 400 244, 470 214, 540 200 C 590 190, 615 205, 640 216"
      fill="none" stroke="#f0904f" stroke-width="6" stroke-linecap="round"/>

    <!-- axis labels -->
    <text x="60" y="418" font-size="17" fill="#ffffff" fill-opacity="0.4">20 Hz</text>
    <text x="640" y="418" text-anchor="end" font-size="17" fill="#ffffff" fill-opacity="0.4">20 kHz</text>

    <!-- legend -->
    <g transform="translate(60 52)">
      <rect x="0" y="-14" width="34" height="5" rx="2.5" fill="#f0904f"/>
      <text x="48" y="-6" font-size="19" font-weight="600" fill="#f0904f">Bass-forward — flattering</text>
      <rect x="0" y="20" width="34" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.85"/>
      <text x="48" y="28" font-size="19" font-weight="600" fill="#ffffff" fill-opacity="0.8">Flat — revealing</text>
    </g>

    <!-- callout: what the boost hides -->
    <text x="60" y="330" font-size="18" fill="#ffffff" fill-opacity="0.45">A boosted low end hides the rumble,</text>
    <text x="60" y="356" font-size="18" fill="#ffffff" fill-opacity="0.45">plosives and handling noise you need to hear.</text>
  </g>

  <text x="800" y="756" text-anchor="middle" font-size="21" fill="#ffffff" fill-opacity="0.5">Good headphones · wrong job</text>
</svg>
